<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Subtle) -->
  <circle cx="64" cy="64" r="54" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Gauge Arc Background -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="210 264" stroke-dashoffset="-27" stroke-linecap="round"/>

  <!-- Gauge Arc Active Value -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="165 264" stroke-dashoffset="-27" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Icon: Pulse / Activity Speedometer -->
  <path d="M44 64h8l5-12 8 24 6-16 5 4h10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Mini token particles -->
  <circle cx="64" cy="38" r="2.5" fill="#f43f5e" />
  <circle cx="90" cy="50" r="2" fill="#818cf8" />
  <circle cx="38" cy="50" r="2" fill="#38bdf8" />
</svg>
